<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rental Rescue — Cashflow Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d0d0d;--ink2:#3a3a3a;--ink3:#7a7a7a;
  --paper:#faf9f6;--paper2:#f1efe8;--paper3:#e8e4da;
  --gold:#c8933a;--gold2:#e8b04a;
  --green:#1a6b4a;--green2:#e6f5ee;
  --red:#b83232;--red2:#fbeaea;
  --border:rgba(0,0,0,0.1);
  --r:14px;--r2:10px;
  --shadow2:0 8px 40px rgba(0,0,0,0.12);
}
html,body{min-height:100%;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
#root{min-height:100vh;display:flex;flex-direction:column}
.header{padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:white;position:sticky;top:0;z-index:50}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:-0.02em;color:var(--ink)}
.logo span{color:var(--gold)}
.badge{font-size:11px;background:var(--paper2);border:1px solid var(--border);padding:4px 10px;border-radius:20px;color:var(--ink3);font-weight:500}
.main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem 4rem}
.card{width:100%;max-width:560px;background:white;border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow2);overflow:hidden}
.progress-track{height:3px;background:var(--paper2)}
.progress-fill{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 0.5s cubic-bezier(.4,0,.2,1)}
.step-meta{padding:1.25rem 2rem 0;display:flex;align-items:center;justify-content:space-between;min-height:44px}
.step-num{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:0.04em;text-transform:uppercase}
.back-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--ink3);font-family:'DM Sans',sans-serif;padding:4px 0;display:flex;align-items:center;gap:4px;transition:color 0.2s}
.back-btn:hover{color:var(--ink)}
.step-body{padding:1.5rem 2rem 2rem}
.step-q{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700;line-height:1.3;color:var(--ink);margin-bottom:0.35rem}
.step-hint{font-size:14px;color:var(--ink3);margin-bottom:1.75rem;line-height:1.6}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.opt-grid.single{grid-template-columns:1fr}
.opt-grid.three{grid-template-columns:1fr 1fr 1fr}
.opt-btn{background:var(--paper);border:1.5px solid var(--border);border-radius:var(--r2);padding:14px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--ink2);text-align:left;transition:all 0.15s;line-height:1.4;position:relative}
.opt-btn:hover{border-color:var(--gold);background:white;transform:translateY(-1px);box-shadow:0 4px 12px rgba(200,147,58,0.15)}
.opt-btn.selected{border-color:var(--gold);background:white;color:var(--ink);box-shadow:0 0 0 3px rgba(200,147,58,0.15)}
.opt-btn.selected::after{content:'';position:absolute;top:10px;right:12px;width:8px;height:8px;background:var(--gold);border-radius:50%}
.opt-btn .sub{font-size:12px;color:var(--ink3);font-weight:400;margin-top:2px;display:block}
.cta-btn{width:100%;padding:16px;background:var(--ink);color:white;border:none;border-radius:var(--r2);font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.01em}
.cta-btn:hover{background:#1a1a1a;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,0.2)}
.cta-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}
.cta-btn.gold{background:var(--gold)}
.cta-btn.gold:hover{background:#b8832a;box-shadow:0 6px 20px rgba(200,147,58,0.35)}
.sec-btn{background:var(--paper2);border:1.5px solid var(--border);border-radius:var(--r2);padding:16px;cursor:pointer;font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--ink2);transition:all 0.15s;line-height:1;white-space:nowrap}
.sec-btn:hover{border-color:var(--gold);background:white;color:var(--ink)}
.addr-wrap{position:relative;margin-bottom:1.5rem}
.addr-input{width:100%;padding:14px 16px;font-size:15px;font-family:'DM Sans',sans-serif;border:1.5px solid var(--border);border-radius:var(--r2);background:var(--paper);color:var(--ink);outline:none;transition:border-color 0.2s}
.addr-input:focus{border-color:var(--gold);background:white}
.lookup-screen{padding:3rem 2rem;text-align:center}
.spinner{width:48px;height:48px;border:3px solid var(--paper2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
.lookup-text{font-size:15px;color:var(--ink2);font-weight:500;margin-bottom:6px}
.lookup-sub{font-size:13px;color:var(--ink3)}
.confirm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.confirm-cell{background:var(--paper2);border-radius:var(--r2);padding:14px}
.clabel{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:4px;font-weight:500}
.cval{font-size:17px;font-family:'Syne',sans-serif;font-weight:700;color:var(--ink)}
.results-hero{background:var(--ink);padding:2rem;text-align:center}
.results-hero .tag{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.45);margin-bottom:0.75rem}
.results-hero .big-num{font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;color:var(--gold2);line-height:1;margin-bottom:0.4rem}
.results-hero .big-sub{font-size:13px;color:rgba(255,255,255,0.6);line-height:1.5}
.verdict-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:30px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;margin-top:1rem}
.verdict-badge.hold{background:rgba(26,107,74,0.3);color:#6fcf97}
.verdict-badge.reposition{background:rgba(200,147,58,0.3);color:var(--gold2)}
.verdict-badge.sell{background:rgba(184,50,50,0.3);color:#f47878}
.results-body{padding:1.5rem 2rem 2rem}
.results-section{margin-bottom:1.75rem}
.results-section h4{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink3);margin-bottom:0.75rem;font-weight:600}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.metric-row .ml{font-size:14px;color:var(--ink2)}
.metric-row .mr{font-size:15px;font-weight:500;color:var(--ink);font-family:'Syne',sans-serif}
.metric-row .mr.pos{color:var(--green)}
.metric-row .mr.neg{color:var(--red)}
.metric-row .mr.gold{color:var(--gold)}
.equity-bar-wrap{background:var(--paper2);border-radius:8px;height:10px;overflow:hidden;margin:10px 0 4px}
.equity-bar{height:10px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:8px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.equity-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.insight-box{background:var(--paper2);border-radius:var(--r2);padding:1rem 1.25rem;margin-bottom:1.5rem;border-left:3px solid var(--gold)}
.insight-box p{font-size:14px;color:var(--ink2);line-height:1.65}
.lead-form{display:flex;flex-direction:column;gap:12px;margin-bottom:1.5rem}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-group label{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);font-weight:500}
.field-group input{padding:13px 14px;font-size:15px;font-family:'DM Sans',sans-serif;border:1.5px solid var(--border);border-radius:var(--r2);background:var(--paper);color:var(--ink);outline:none;transition:border-color 0.2s}
.field-group input:focus{border-color:var(--gold);background:white}
.ty-icon{width:64px;height:64px;background:var(--green2);border:2px solid rgba(26,107,74,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:26px}
.ty-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:0.5rem}
.ty-sub{font-size:14px;color:var(--ink3);text-align:center;line-height:1.6;margin-bottom:1.75rem}
.summary-card{background:var(--paper2);border-radius:var(--r);padding:1.25rem;margin-bottom:1.5rem;text-align:left;border:1px solid var(--border)}
@media(max-width:480px){
  .main{padding:1rem 0 3rem}
  .card{border-radius:0;border-left:none;border-right:none;box-shadow:none}
  .step-q{font-size:1.2rem}
  .results-hero .big-num{font-size:2.4rem}
  .header{padding:1rem 1.25rem}
  .opt-grid.three{grid-template-columns:1fr 1fr}
}
.step-enter{animation:fadeSlide 0.28s ease forwards}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_PLACES_KEY&libraries=places"></script>
<script>
const {useState,useEffect,useRef}=React;

const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const API_BASE="";

function runDecisionEngine(s){
  const {propData,condition,currentUse,payment,loanBalance,goal}=s;
  const payMids={"Under $1,000":800,"$1,000–$1,500":1250,"$1,500–$2,000":1750,"$2,000–$2,500":2250,"$2,500+":2900,"Not sure":1500};
  const loanMids={"Under $100K":75000,"$100K–$200K":150000,"$200K–$300K":250000,"$300K–$500K":400000,"$500K+":600000,"Not sure":200000};
  const sqftMids={"Under 1,000":850,"1,000–1,500":1250,"1,500–2,000":1750,"2,000–3,000":2500,"3,000+":3500};

  const beds      =parseInt(propData.beds)||3;
  const baths     =parseFloat(propData.baths)||2;
  const sqft      =sqftMids[propData.sqft]||1750;
  const hasGarage =propData.garage&&propData.garage!=="No"&&propData.garage!=="Not sure";
  const hasFinAttic=propData.attic==="Finished";
  const estValue  =propData.estValue||300000;

  const baseRent =beds*350+baths*150+sqft*0.18+(hasGarage?150:0)+(hasFinAttic?100:0);
  const condMult ={"Needs work":0.82,"Rent-ready":1.0,"Updated":1.08,"Fully renovated":1.16}[condition]||1.0;
  const ltrRent  =Math.round(baseRent*condMult/50)*50;
  const strMonthly=Math.round(ltrRent*(1.6+(beds>3?0.15:0)+(hasGarage?0.05:0))/50)*50;
  const mtrMonthly=Math.round(ltrRent*1.35/50)*50;

  const piti          =payMids[payment]||1500;
  const currentFlow   =ltrRent-piti;
  const optimizedFlow =strMonthly-piti;

  const loan      =loanMids[loanBalance]||200000;
  const equity    =estValue-loan;
  const equityPct =Math.round((equity/estValue)*100);

  const currentIncome={"Long-term rental":ltrRent,"Mid-term rental":mtrMonthly,"Short-term rental":strMonthly,"Vacant":0,"Owner occupied":0}[currentUse]??ltrRent;
  const upside=Math.max(0,strMonthly-currentIncome);

  let verdict="Hold & Optimize",verdictKey="hold",reasoning="";
  const sellByGoal  =goal==="Sell soon";
  const sellByEquity=equityPct>45&&currentFlow<0;

  if(sellByGoal||sellByEquity){
    verdict="Sell & Redeploy";verdictKey="sell";
    if(sellByGoal&&!sellByEquity){
      reasoning=`Since you're planning to exit, now is a strategic time to act. With an estimated $${Math.round(equity/1000)}K in equity (${equityPct}%), you have real capital to redeploy into a higher-performing asset.`;
    }else if(sellByEquity&&!sellByGoal){
      reasoning=`With ${equityPct}% equity but a monthly cashflow of ${fmt(currentFlow)}, your capital is locked up and working against you. Selling now frees $${Math.round(equity/1000)}K to redeploy more efficiently.`;
    }else{
      reasoning=`Your goal aligns with the numbers — ${equityPct}% equity paired with negative cashflow makes this a strong exit window. Freeing up $${Math.round(equity/1000)}K opens the door to a better-performing asset.`;
    }
  }else if((currentUse==="Long-term rental"||currentUse==="Vacant"||currentUse==="Owner occupied")&&upside>400&&condition!=="Needs work"){
    verdict="Reposition to STR/MTR";verdictKey="reposition";
    reasoning=`Your property (${beds}BR/${baths}BA, ${(condition||"").toLowerCase()}) is well-suited for mid or short-term rental. Based on your profile and market, repositioning could add $${upside.toLocaleString()}/mo in gross income.`;
  }else{
    const action=condition==="Needs work"?"completing deferred repairs":condition==="Rent-ready"?"targeted cosmetic upgrades":"better lease structuring and tenant selection";
    reasoning=`Your property is on solid footing. With ${action}, you can push LTR rent toward the $${(ltrRent+150).toLocaleString()}–$${(ltrRent+300).toLocaleString()} range and improve monthly cashflow by $150–$300.`;
  }

  return{ltrRent,strMonthly,mtrMonthly,piti,currentFlow,optimizedFlow,equity,equityPct,estValue,loan,upside,verdict,verdictKey,reasoning};
}
